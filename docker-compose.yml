services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gadget_mania_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gadget_mania_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rahasia}
      TZ: Asia/Jakarta
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - gadget-mania-net

  webserver:
    image: nginx:alpine
    container_name: gadget_mania_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gadget-mania-net

  db:
    image: mysql:8.0
    container_name: gadget_mania_db
    restart: unless-stopped
    command: --default-time-zone=+07:00
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gadget_mania_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rahasia}
      TZ: Asia/Jakarta
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - gadget-mania-net

networks:
  gadget-mania-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
